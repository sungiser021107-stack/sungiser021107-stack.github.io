        <h1>Pytorch 数据集加载</h1>

        <p>在 PyTorch 中，自定义数据集需要继承 <code>Dataset</code> 类。</p>

        <p>必须实现三个核心方法：</p>
        <p><code>__init__</code>：初始化数据路径、标签、预处理方法。</p>
        <p><code>__len__</code>：返回数据集的总样本数量。</p>
        <p><code>__getitem__</code>：根据索引读取图片和标签，并做数据转换。</p>

        <p>OpenCV 读取的图片默认是 HWC 格式，需要转成 CHW 才能用于模型训练。</p>

        <p>转换方法：<code>permute(2, 0, 1)</code></p>
